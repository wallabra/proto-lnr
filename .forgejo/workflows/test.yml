name: Lints and unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    strategy:
      matrix:
        node-version: [21.x]

    runs-on: codeberg-small-lazy

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm i --global pnpm
          pnpm i

      - name: Lint
        run: |
          pnpm lint

  test:
    strategy:
      matrix:
        node-version: [21.x]

    runs-on: codeberg-small-lazy
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm i --global pnpm
          pnpm i

      - name: Test
        run: |
          pnpm test
